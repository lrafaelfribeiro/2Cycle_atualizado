<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            background: #0D0D0F;
        }

        .route-marker {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 2px solid #0D0D0F;
        }

            .route-marker.origin {
                background: #A6E22E;
            }

            .route-marker.destination {
                background: #E23F3F;
            }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: [-8.348, 41.486],
            zoom: 14
        });

        let mode = 'point-to-point';
        let originMarker = null;
        let destinationMarker = null;
        let mapReady = false;
        let pendingDraw = null;
        let locked = false;

        map.on('load', () => {
            map.addSource('route-line', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
            });
            map.addLayer({
                id: 'route-line-layer',
                type: 'line',
                source: 'route-line',
                paint: { 'line-color': '#A6E22E', 'line-width': 4 }
            });

            mapReady = true;

            if (pendingDraw) {
                drawRoute(pendingDraw);
                pendingDraw = null;
            }

            // Linha tracejada de pré-visualização, antes de calcular a rota real
            map.addSource('preview-line', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
            });
            map.addLayer({
                id: 'preview-line-layer',
                type: 'line',
                source: 'preview-line',
                paint: {
                    'line-color': '#FFFFFF',
                    'line-width': 2,
                    'line-dasharray': [2, 2]
                }
            });
        });

        function setLocked(isLocked) {
            locked = isLocked;
        }

        function makeMarkerEl(variant) {
            const el = document.createElement('div');
            el.className = 'route-marker ' + variant;
            el.innerText = variant === 'origin' ? '🚩' : '⏹';
            return el;
        }

        function setMode(newMode) {
            mode = newMode;
            clearMap();
        }

        function clearMap() {
            if (originMarker) { originMarker.remove(); originMarker = null; }
            if (destinationMarker) { destinationMarker.remove(); destinationMarker = null; }
            map.getSource('route-line')?.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
            map.getSource('preview-line')?.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
        }

        function drawPreviewLine(originLat, originLng, destLat, destLng) {
            map.getSource('preview-line')?.setData({
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: [[originLng, originLat], [destLng, destLat]] }
            });
        }

        // Reposiciona os dois marcadores (usado depois de "trocar origem/destino")
        function setPoints(originLat, originLng, destLat, destLng) {
            if (originMarker) originMarker.remove();
            if (destinationMarker) destinationMarker.remove();

            originMarker = new maplibregl.Marker({ element: makeMarkerEl('origin') }).setLngLat([originLng, originLat]).addTo(map);
            destinationMarker = new maplibregl.Marker({ element: makeMarkerEl('destination') }).setLngLat([destLng, destLat]).addTo(map);

            drawPreviewLine(originLat, originLng, destLat, destLng);
        }


        function drawRoute(points) {

            if (!Array.isArray(points) || points.length === 0) {
                return;
            }

            if (!mapReady) {
                pendingDraw = points;
                return;
            }

            const coordinates = points
                .map(p => [Number(p.longitude), Number(p.latitude)])
                .filter(([lng, lat]) => Number.isFinite(lng) && Number.isFinite(lat));

            if (coordinates.length === 0) {
                console.error('drawRoute: nenhum ponto válido', points);
                return;
            }

            map.getSource('preview-line')?.setData({
                type: 'Feature',
                geometry: {
                    type: 'LineString',
                    coordinates: []
                }
            });

            map.getSource('route-line')?.setData({
                type: 'Feature',
                geometry: {
                    type: 'LineString',
                    coordinates: coordinates
                }
            });

            if (coordinates.length > 0) {
                const bounds = coordinates.reduce(
                    (b, c) => b.extend(c),
                    new maplibregl.LngLatBounds(coordinates[0], coordinates[0])
                );

                map.fitBounds(bounds, { padding: 40 });
            }
        }

        function centerOnLocation(lat, lng) {
            map.flyTo({ center: [lng, lat], zoom: 15 });
        }

        function sendToNative(message) {
            const data = encodeURIComponent(JSON.stringify(message));
            window.location.href = 'app://message?data=' + data;
        }

        map.on('click', (e) => {

            if (locked) return;

            const { lat, lng } = e.lngLat;

            if (mode === 'round-trip') {
                if (originMarker) originMarker.remove();
                originMarker = new maplibregl.Marker({ element: makeMarkerEl('origin') }).setLngLat([lng, lat]).addTo(map);
                sendToNative({ type: 'origin', lat, lng });
                return;
            }

            if (!originMarker) {
                originMarker = new maplibregl.Marker({ element: makeMarkerEl('origin') }).setLngLat([lng, lat]).addTo(map);
                sendToNative({ type: 'origin', lat, lng });
            } else if (!destinationMarker) {
                destinationMarker = new maplibregl.Marker({ element: makeMarkerEl('destination') }).setLngLat([lng, lat]).addTo(map);
                sendToNative({ type: 'destination', lat, lng });

                // Pré-visualização imediata, sem esperar por "Calcular rota"
                const originLngLat = originMarker.getLngLat();
                drawPreviewLine(originLngLat.lat, originLngLat.lng, lat, lng);
            } else {
                clearMap();
                originMarker = new maplibregl.Marker({ element: makeMarkerEl('origin') }).setLngLat([lng, lat]).addTo(map);
                sendToNative({ type: 'origin', lat, lng });
            }
        });
    </script>
</body>
</html>
